[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dualneuron"
version = "0.0.1"
description = ""
readme = "README.md"
authors = [{ name = "Nikos Karantzas" }]
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
	"nnvision @ git+https://github.com/KonstantinWilleke/nnvision.git@interview",
	"datasets",
	"opencv-python",
	"python-dotenv",
	"dreamsim",
	"datajoint<2.2",
	"torch",
	"torchvision"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dualneuron*"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
